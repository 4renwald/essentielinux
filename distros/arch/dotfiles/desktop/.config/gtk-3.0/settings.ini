[Settings]
# GTK3 applications on Wayland read this file directly. They do not follow the
# gsettings keys Caelestia writes with `dconf write`, so without these lines
# Thunar and pavucontrol stay light while every GTK4 and Electron window
# follows the dark scheme through the portal.
#
# Only the theme selection lives here. The colours themselves come from
# gtk.css, which `caelestia scheme set` regenerates next to this file on every
# scheme change; pinning colours here would freeze them.
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
