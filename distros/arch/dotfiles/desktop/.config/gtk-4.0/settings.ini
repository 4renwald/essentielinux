[Settings]
# libadwaita ignores gtk-theme-name, so GTK4 gets the dark preference and the
# icon theme only. Its colours come from gtk.css, regenerated next to this file
# by `caelestia scheme set`.
gtk-icon-theme-name=Papirus-Dark
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
