# Persistent command-line flags for Helium.
# Managed by workstation; reapply with ./install.sh 50.
#
# The helium-browser-bin wrapper reads this file and /etc/helium-browser-flags.conf
# before launching. Confirm what actually took effect at helium://version, under
# "Command Line", and what the GPU process ended up doing at helium://gpu.
#
# Hardware video decoding on NVIDIA goes through libva-nvidia-driver (installed
# by module 20), which is a VA-API front end for NVDEC. Chromium reaches it only
# over the ANGLE-on-desktop-GL path, so --use-gl and --use-angle below are not
# optional extras: without them the VA-API features are accepted and then never
# used. LIBVA_DRIVER_NAME and NVD_BACKEND come from hypr-user.lua.

# Native Wayland rather than XWayland. Helium inherits Chromium's default of
# X11 unless it is told to look.
--ozone-platform-hint=auto

# AcceleratedVideoDecodeLinuxGL is the current name; it was
# VaapiVideoDecodeLinuxGL before Chromium 131. VaapiOnNvidiaGPUs is what lifts
# Chromium's refusal to use VA-API on NVIDIA at all.
--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs

# Chromium blocklists the NVIDIA proprietary stack for video decode regardless
# of the features above.
--ignore-gpu-blocklist

# The ANGLE-over-desktop-GL backend libva-nvidia-driver documents as required.
--use-gl=angle
--use-angle=gl
