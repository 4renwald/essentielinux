# Managed by workstation; reapply with ./install.sh 50.
#
# mpv.conf already applies ArtCNN C4F16 automatically to anything below 1440p.
# These bindings override that choice for the file currently playing, because
# which upscaler is right depends on the source: CNN doublers sharpen live
# action, Anime4K reconstructs line art and looks wrong on everything else.
#
# ~~/shaders is the symlink module 55 points at the default-shader-pack clone
# installed by module 30, so these paths stay valid across upstream updates.

CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Upscaler: off (libplacebo scaler only)"

CTRL+1 no-osd change-list glsl-shaders clr ""; no-osd change-list glsl-shaders append "~~/shaders/ArtCNN_C4F16.glsl"; show-text "Upscaler: ArtCNN C4F16"

CTRL+2 no-osd change-list glsl-shaders clr ""; no-osd change-list glsl-shaders append "~~/shaders/ArtCNN_C4F32.glsl"; show-text "Upscaler: ArtCNN C4F32 (heavy)"

CTRL+3 no-osd change-list glsl-shaders clr ""; no-osd change-list glsl-shaders append "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"; show-text "Upscaler: FSRCNNX x2"

# Anime4K Mode A, the upstream restore-then-upscale chain for line art. The two
# AutoDownscalePre passes are what keep it from over-upscaling on a 4K display.
CTRL+4 no-osd change-list glsl-shaders clr ""; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_Clamp_Highlights.glsl"; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_Restore_CNN_M.glsl"; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_AutoDownscalePre_x2.glsl"; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_AutoDownscalePre_x4.glsl"; no-osd change-list glsl-shaders append "~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Upscaler: Anime4K Mode A"
