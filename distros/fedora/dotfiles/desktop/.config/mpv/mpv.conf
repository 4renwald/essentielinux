# mpv, configured as this system's video upscaler.
# Managed by workstation; reapply with ./install.sh 50.
#
# Linux has no equivalent of NVIDIA's RTX Video Super Resolution. RTX VSR is a
# Windows-only feature: the browser hands a decoded frame to D3D11 video
# processing through an NVIDIA-private extension, and nothing in VA-API, VDPAU
# or Vulkan Video exposes that path. NVIDIA's Maxine SDK ships the same class of
# model with Linux driver requirements, but no browser calls it. So browser
# video is sent here instead, where libplacebo scales it properly and a CNN
# upscaler can run as a GLSL shader. Module 55 wires the ff2mpv handoff.

# --- Renderer ---------------------------------------------------------------
# gpu-next is mpv 0.41's default. Naming it keeps this file correct on an older
# mpv, and every shader referenced below is written against libplacebo.
vo=gpu-next
gpu-api=vulkan

# mpv's own preset for "the GPU can afford it": ewa_lanczossharp upscaling,
# linear-light correct downscaling, sigmoidal upscaling and a proper dither.
# It replaces the deprecated gpu-hq. Anything below this line overrides it on
# purpose.
profile=high-quality

# hwdec stays on auto-safe rather than pinned to nvdec so this config survives a
# GPU change. On this machine auto-safe selects nvdec, which decodes on the GPU
# and hands libplacebo the frame without a round trip through system memory.
# This is NVDEC directly, not the VA-API shim the browsers use, so it is
# unaffected by LIBVA_DRIVER_NAME.
hwdec=auto-safe

# Deband the source, not the upscaled output. Streaming sites ship heavily
# compressed gradients and every upscaler amplifies the banding in them.
deband=yes
deband-iterations=2
deband-threshold=48

# Interpolation is deliberately off. It requires video-sync=display-resample,
# and hypr-user.lua runs the display at VRR mode 3, which moves the refresh rate
# underneath fullscreen video. Resampling against a refresh rate that is itself
# changing adds judder rather than removing it.

# --- CNN upscaling ----------------------------------------------------------
# ArtCNN is the closest thing Linux has to what RTX VSR does: a small
# convolutional network, run as a GLSL shader, that doubles luma resolution
# instead of interpolating it. C4F16 is the light model and is what a 4090 can
# run on anything without dropping frames.
#
# This is a conditional auto profile: mpv applies it when the source is below
# 1440p, which is where doubling actually helps, and profile-restore=copy undoes
# it when a higher-resolution file loads. input.conf binds the heavier models and
# the anime-specific chains for overriding this per file.
[cnn-luma-doubler]
profile-desc=CNN luma doubler for sources below 1440p
profile-cond=p["video-params/w"] ~= nil and p["video-params/w"] < 2560
profile-restore=copy
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl"

# --- Streaming --------------------------------------------------------------
# ytdl_hook resolves page URLs through yt-dlp. Cap at 2160p: above that the
# bitrate gain stops being visible and the seek behaviour gets worse.
ytdl-format=bestvideo[height<=?2160]+bestaudio/best

# Open the window before yt-dlp has finished resolving the URL, so clicking
# ff2mpv in the browser produces something immediately instead of two silent
# seconds.
force-window=immediate

# Streaming sites are the main source here, so buffer generously.
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=20

# --- Behaviour --------------------------------------------------------------
keep-open=yes
save-position-on-quit=yes
